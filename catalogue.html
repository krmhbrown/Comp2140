<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Peak Finds – Catalogue</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="site.css">
  <style>
    .photo.has-img .ph { display: none; }
  </style>
</head>
<body>
  <div class="topbar">Trendy, affordable bags. Cash on delivery or bank transfer.</div>
  <header class="header">
    <a href="catalogue.html" class="logo"><img src="images/logo.png" alt="Peak Finds" onerror="this.remove()"><span>PEAK FINDS</span></a>
    <div class="searchbox">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#555" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <input type="text" id="search" placeholder="Search for bags or colours">
    </div>
    <div class="icons">
      <!-- Sign in belongs to another teammate's feature: links to Tamara's customer page (account section) until the final login page is ready -->
      <a href="website/customer.html#account" class="icon-link" title="Sign in">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="10" r="3.2"/><path d="M5.8 18.2c1.6-2.3 3.7-3.4 6.2-3.4s4.6 1.1 6.2 3.4"/></svg>
        <span class="label">Sign In</span>
      </a>
      <!-- Cart belongs to another teammate's feature: links to Tamara's customer page (cart section) until the final cart page is ready -->
      <a href="website/customer.html#cart" class="icon-link" title="Cart">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8h12l1 12H5L6 8z"/><path d="M9 8V6.5a3 3 0 016 0V8"/></svg>
        <span class="cart-count" id="cartCount">0</span>
      </a>
    </div>
  </header>
  <nav class="nav" id="nav">
    <a href="catalogue.html" data-cat="">Shop All</a>
    <a href="catalogue.html?cat=Backpack" data-cat="Backpack">Backpacks</a>
    <a href="catalogue.html?cat=Shoulder Bag" data-cat="Shoulder Bag">Shoulder Bags</a>
    <a href="catalogue.html?cat=Crossbody Bag" data-cat="Crossbody Bag">Crossbody Bags</a>
    <a href="catalogue.html?cat=Tote Bag" data-cat="Tote Bag">Totes</a>
  </nav>

  <main>
    <div class="crumbs"><a href="catalogue.html">Home</a> / <span id="crumb">Shop All</span></div>
    <h1 class="title" id="title">Shop All Bags</h1>
    <div class="count" id="count"></div>
    <div class="toolbar">
      <span></span>
      <select id="sort">
        <option value="">Sort by: Featured</option>
        <option value="low">Price: low to high</option>
        <option value="high">Price: high to low</option>
      </select>
    </div>
    <div class="grid" id="productGrid"></div>
  </main>

  <script src="products.js"></script>
  <script>
    // Customers never see the supplier or the reorder level (SRS Feature 04, UR1 SR-1).
    const grid = document.getElementById("productGrid");
    const search = document.getElementById("search");
    const sort = document.getElementById("sort");
    const cat = new URLSearchParams(location.search).get("cat") || "";

    // highlight the active nav link and set the headings
    document.querySelectorAll("#nav a").forEach(a => { if (a.dataset.cat === cat) a.classList.add("active"); });
    document.getElementById("title").textContent = cat ? cat + "s" : "Shop All Bags";
    document.getElementById("crumb").textContent = cat ? cat + "s" : "Shop All";

    function showProducts() {
      const term = search.value.toLowerCase();
      let list = products.filter(p =>
        (cat === "" || p.category === cat) &&
        (p.name.toLowerCase().includes(term) || p.colour.toLowerCase().includes(term))
      );
      if (sort.value === "low") list.sort((a, b) => a.price - b.price);
      if (sort.value === "high") list.sort((a, b) => b.price - a.price);

      document.getElementById("count").textContent = list.length + (list.length === 1 ? " item" : " items");

      if (list.length === 0) { grid.innerHTML = '<p class="empty">No bags found.</p>'; return; }

      grid.innerHTML = list.map(p => {
        const out = p.quantity === 0;   // "Out of Stock" when the quantity is 0 (UR4 SR-2)
        return `
          <a class="card ${out ? "soldout" : ""}" href="productdetails.html?id=${p.id}">
            <div class="photo">
              <span class="ph">👜</span>
              <img src="${p.image}" alt="${p.name}" onload="this.parentElement.classList.add('has-img')" onerror="this.remove()">
              ${out ? '<span class="badge">Out of Stock</span>' : ""}
            </div>
            <div class="name">${p.name}</div>
            <div class="price">${formatPrice(p.price)}</div>
          </a>`;
      }).join("");
    }

    search.addEventListener("input", showProducts);
    sort.addEventListener("change", showProducts);
    showProducts();
  </script>
</body>
</html>
