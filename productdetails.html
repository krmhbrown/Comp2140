<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Peak Finds – Product Details</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="site.css">
  <style>
    .detail { display: grid; grid-template-columns: 1.1fr 1fr; gap: 48px; align-items: start; }
    .detail .photo { aspect-ratio: 1 / 1; border-radius: 8px; }
    .detail .photo .ph { font-size: 120px; }
    .photo.has-img .ph { display: none; }
    .detail h1 { font-size: 30px; font-weight: 600; margin: 0 0 6px; line-height: 1.3; }
    .code { font-size: 13px; color: var(--muted); }
    .detail .price { font-size: 26px; margin: 16px 0; }
    .stock { display: inline-block; font-size: 13px; font-weight: 500; padding: 5px 14px; border-radius: 20px; }
    .stock.in { background: #e6ede1; color: #2f4a3d; }
    .stock.out { background: #fbe9e7; color: var(--red); }
    .facts { margin: 22px 0; font-size: 15px; line-height: 2; border-top: 1px solid var(--line); padding-top: 16px; }
    .facts b { font-weight: 500; display: inline-block; width: 100px; }
    .desc { color: var(--muted); line-height: 1.7; }
    .missing { text-align: center; color: var(--muted); padding: 60px 0; }
    @media (max-width: 800px) { .detail { grid-template-columns: 1fr; gap: 24px; } }
  </style>
</head>
<body>
  <div class="topbar">Trendy, affordable bags. Cash on delivery or bank transfer.</div>
  <header class="header">
    <a href="catalogue.html" class="logo"><img src="images/logo.png" alt="Peak Finds" onerror="this.remove()"><span>PEAK FINDS</span></a>
    <div class="searchbox">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#555" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <input type="text" id="search" placeholder="Search for bags or colours" onkeydown="if(event.key==='Enter')location.href='catalogue.html'">
    </div>
    <div class="icons">
      <!-- Sign in belongs to another teammate's feature: change login.html to their file name -->
      <a href="login.html" class="icon-link" title="Sign in">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="10" r="3.2"/><path d="M5.8 18.2c1.6-2.3 3.7-3.4 6.2-3.4s4.6 1.1 6.2 3.4"/></svg>
        <span class="label">Sign In</span>
      </a>
      <!-- Cart belongs to another teammate's feature: change cart.html to their file name -->
      <a href="cart.html" class="icon-link" title="Cart">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8h12l1 12H5L6 8z"/><path d="M9 8V6.5a3 3 0 016 0V8"/></svg>
        <span class="cart-count" id="cartCount">0</span>
      </a>
    </div>
  </header>
  <nav class="nav" id="nav">
    <a href="catalogue.html" data-cat="">Shop All</a>
    <a href="catalogue.html?cat=Backpack" data-cat="Backpack">Backpacks</a>
    <a href="catalogue.html?cat=Shoulder Bag" data-cat="Shoulder Bag">Shoulder Bags</a>
    <a href="catalogue.html?cat=Crossbody Bag" data-cat="Crossbody Bag">Crossbody Bags</a>
    <a href="catalogue.html?cat=Tote Bag" data-cat="Tote Bag">Totes</a>
  </nav>

  <main>
    <div class="crumbs"><a href="catalogue.html">Home</a> / <a href="catalogue.html">Shop All</a> / <span id="crumb"></span></div>
    <div id="content"></div>
  </main>

  <script src="products.js"></script>
  <script>
    // Customers never see the supplier or the reorder level (SRS Feature 04, UR1 SR-1).
    const id = new URLSearchParams(location.search).get("id");
    const p = products.find(item => item.id === id);
    const content = document.getElementById("content");

    if (!p) {
      content.innerHTML = '<p class="missing">Sorry, we could not find that bag.</p>';
    } else {
      const out = p.quantity === 0;   // "Out of Stock" when the quantity is 0 (UR4 SR-2)
      document.title = "Peak Finds – " + p.name;
      document.getElementById("crumb").textContent = p.name;
      content.innerHTML = `
        <div class="detail">
          <div class="photo">
            <span class="ph">👜</span>
            <img src="${p.image}" alt="${p.name}" onload="this.parentElement.classList.add('has-img')" onerror="this.remove()">
          </div>
          <div>
            <h1>${p.name}</h1>
            <div class="code">${p.id}</div>
            <div class="price">${formatPrice(p.price)}</div>
            <span class="stock ${out ? "out" : "in"}">${out ? "Out of Stock" : "In Stock"}</span>
            <div class="facts">
              <b>Colour</b> ${p.colour}<br>
              <b>Category</b> ${p.category}
            </div>
            <p class="desc">${p.description}</p>
          </div>
        </div>`;
    }
  </script>
</body>
</html>
