<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Peak Finds – Manage Products</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600&family=Poppins:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --green: #3f5e4f; --green-dark: #2f4a3d; --green-light: #e6ede1;
      --bg: #f4f6f1; --border: #bfcdb8; --text: #25372e; --muted: #6b7a70;
      --red: #b3261e; --red-light: #fbe9e7; --amber: #8a5a00; --amber-light: #fdf1d6;
      --heading-font: 'Playfair Display', serif;
      --body-font: 'Poppins', sans-serif;
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: var(--body-font); color: var(--text); background: var(--bg); }
    header {
      background: var(--green); color: white; padding: 18px 40px;
      display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px;
    }
    .brand { display: flex; align-items: center; color: white; text-decoration: none; }
    .brand img { height: 44px; display: block; }
    .brand img + h1 { display: none; }
    header h1 { font-family: var(--heading-font); margin: 0; font-size: 28px; font-weight: 600; letter-spacing: 1px; }
    nav a { color: white; text-decoration: none; margin-left: 20px; font-size: 14px; opacity: .85; }
    nav a:hover, nav a.active { opacity: 1; border-bottom: 2px solid white; padding-bottom: 2px; }
    main { max-width: 1100px; margin: 0 auto; padding: 30px 20px; }
    .top { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 15px; }
    .top h2 { font-family: var(--heading-font); color: var(--green); font-size: 30px; margin: 0; font-weight: 600; }
    .add-btn {
      background: var(--green); color: white; text-decoration: none; padding: 11px 22px;
      border-radius: 30px; font-weight: 500; font-size: 14px;
    }
    .add-btn:hover { background: var(--green-dark); }

    .alert { display: none; background: var(--amber-light); border: 1px solid #e6c46a; color: var(--amber); border-radius: 12px; padding: 14px 18px; margin-top: 22px; font-size: 14px; line-height: 1.6; }
    .alert b { font-weight: 600; }

    .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; margin: 25px 0; }
    .stat { background: white; border: 1px solid var(--border); border-radius: 14px; padding: 18px; }
    .stat p { margin: 0; font-size: 13px; color: var(--muted); }
    .stat h3 { margin: 5px 0 0; font-size: 28px; font-weight: 500; }
    .stat.low h3 { color: var(--amber); }
    .stat.out h3 { color: var(--red); }
    .search {
      width: 100%; padding: 12px 16px; border: 1.5px solid var(--border); border-radius: 30px;
      font-family: inherit; font-size: 15px; background: white; margin-bottom: 25px;
    }
    .search:focus { outline: none; border-color: var(--green); }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 20px; }
    .card { background: white; border: 1px solid var(--border); border-radius: 16px; overflow: hidden; display: flex; flex-direction: column; }
    .photo { height: 160px; background: var(--green-light); display: flex; align-items: center; justify-content: center; font-size: 50px; position: relative; }
    .photo img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
    .badge { position: absolute; top: 12px; right: 12px; z-index: 2; font-size: 12px; font-weight: 500; padding: 4px 10px; border-radius: 20px; }
    .badge.in { background: var(--green-light); color: var(--green-dark); border: 1px solid var(--green); }
    .badge.low { background: var(--amber-light); color: var(--amber); }
    .badge.out { background: var(--red-light); color: var(--red); }
    .info { padding: 16px; flex: 1; }
    .info h4 { margin: 0; font-size: 17px; font-weight: 500; }
    .id { font-size: 12px; color: var(--muted); }
    .price { font-size: 18px; color: var(--green); font-weight: 500; margin: 8px 0; }
    .details { font-size: 13px; color: var(--muted); line-height: 1.7; }
    .details b { color: var(--text); font-weight: 500; }
    .owner { margin-top: 10px; background: var(--green-light); border: 1px dashed var(--green); border-radius: 8px; padding: 8px 10px; font-size: 12px; }
    .actions { display: flex; gap: 10px; padding: 0 16px 16px; }
    .actions a, .actions button {
      flex: 1; text-align: center; padding: 9px; border-radius: 20px; font-family: inherit;
      font-size: 14px; cursor: pointer; text-decoration: none;
    }
    .edit { border: 1.5px solid var(--green); color: var(--green); background: white; }
    .edit:hover { background: var(--green-light); }
    .remove { border: 1.5px solid var(--red); color: var(--red); background: white; }
    .remove:hover { background: var(--red-light); }
    .empty { text-align: center; color: var(--muted); grid-column: 1 / -1; }

    .overlay { position: fixed; inset: 0; background: rgba(0,0,0,.45); display: none; align-items: center; justify-content: center; padding: 20px; }
    .overlay.show { display: flex; }
    .modal { background: white; border-radius: 16px; padding: 28px; max-width: 400px; width: 100%; }
    .modal h3 { font-family: var(--heading-font); margin-top: 0; color: var(--red); font-size: 22px; }
    .modal p { color: var(--muted); font-size: 14px; }
    .modal-actions { display: flex; gap: 10px; margin-top: 20px; }
    .modal-actions button { flex: 1; padding: 11px; border-radius: 20px; font-family: inherit; font-size: 14px; cursor: pointer; }
    .cancel { border: 1.5px solid var(--border); background: white; color: var(--text); }
    .confirm { border: none; background: var(--red); color: white; }

    @media (max-width: 600px) {
      header { padding: 16px 20px; }
      nav a { margin-left: 0; margin-right: 15px; }
      .stats { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <header>
    <a href="manageproducts.html" class="brand"><img src="images/logo.png" alt="Peak Finds" onerror="this.remove()"><h1>Peak Finds</h1></a>
    <nav>
      <a href="addproducts.html">Add Product</a>
      <a href="manageproducts.html" class="active">Manage Products</a>
      <a href="catalogue.html">View Shop</a>
    </nav>
  </header>

  <main>
    <div class="top">
      <h2>Manage Products</h2>
      <a href="addproducts.html" class="add-btn">+ Add Product</a>
    </div>

    <div class="alert" id="lowAlert"></div>

    <div class="stats">
      <div class="stat"><p>Total products</p><h3 id="totalCount">0</h3></div>
      <div class="stat low"><p>Low stock</p><h3 id="lowCount">0</h3></div>
      <div class="stat out"><p>Out of stock</p><h3 id="outCount">0</h3></div>
    </div>

    <input type="text" class="search" id="search" placeholder="Search by name or product ID...">

    <div class="grid" id="productGrid"></div>
  </main>

  <div class="overlay" id="removeModal">
    <div class="modal">
      <h3>Remove product?</h3>
      <p>Are you sure you want to remove <b id="removeName"></b>? It will stay in past orders but can't be added to new orders.</p>
      <div class="modal-actions">
        <button class="cancel" id="cancelRemove">Cancel</button>
        <button class="confirm" id="confirmRemove">Yes, remove</button>
      </div>
    </div>
  </div>

  <!-- The bags come from products.js for now. Later they come from the database. -->
  <script src="products.js"></script>
  <script>
    let items = products.slice();   // working copy so Remove can change it

    const grid = document.getElementById("productGrid");
    const search = document.getElementById("search");
    const modal = document.getElementById("removeModal");
    let productToRemove = null;

    function getStockStatus(product) {
      if (product.quantity === 0) return { label: "Out of Stock", type: "out" };
      if (product.quantity <= product.reorderLevel) return { label: "Low Stock", type: "low" };
      return { label: "In Stock", type: "in" };
    }

    function showProducts() {
      const term = search.value.toLowerCase();
      const filtered = items.filter(p =>
        p.name.toLowerCase().includes(term) || p.id.toLowerCase().includes(term)
      );

      if (filtered.length === 0) {
        grid.innerHTML = '<p class="empty">No products found.</p>';
      } else {
        grid.innerHTML = filtered.map(p => {
          const status = getStockStatus(p);
          return `
            <div class="card">
              <div class="photo">
                <span>👜</span>
                <img src="${p.image}" alt="${p.name}" onerror="this.remove()">
                <span class="badge ${status.type}">${status.label}</span>
              </div>
              <div class="info">
                <h4>${p.name}</h4>
                <span class="id">${p.id}</span>
                <div class="price">${formatPrice(p.price)}</div>
                <div class="details">
                  <b>Colour:</b> ${p.colour}<br>
                  <b>Category:</b> ${p.category}<br>
                  <b>In stock:</b> ${p.quantity}
                </div>
                                <div class="owner">🔒 Supplier(s): ${(p.supplierIds || []).join(", ") || "Not set"} · Reorder at: ${p.reorderLevel}</div>
              </div>
              <div class="actions">
                <a class="edit" href="editproducts.html?id=${p.id}">Edit</a>
                <button class="remove" data-id="${p.id}">Remove</button>
              </div>
            </div>`;
        }).join("");
      }

      document.getElementById("totalCount").textContent = items.length;
      document.getElementById("lowCount").textContent = items.filter(p => p.quantity > 0 && p.quantity <= p.reorderLevel).length;
      document.getElementById("outCount").textContent = items.filter(p => p.quantity === 0).length;
      showLowStockAlert();
    }

    // Low-stock banner: shows bags at or below their reorder level (SRS Feature 05, SR-13)
    function showLowStockAlert() {
      const alertBox = document.getElementById("lowAlert");
      const low = items.filter(p => p.quantity <= p.reorderLevel);
      if (low.length === 0) { alertBox.style.display = "none"; return; }
      alertBox.style.display = "block";
      alertBox.innerHTML = "⚠️ <b>" + low.length + (low.length === 1 ? " bag needs" : " bags need") + " restocking:</b> " +
        low.map(p => p.name + " (" + p.quantity + " left)").join(", ");
    }

    // Open the confirmation pop-up when Remove is clicked
    grid.addEventListener("click", function (e) {
      if (e.target.classList.contains("remove")) {
        productToRemove = e.target.dataset.id;
        const product = items.find(p => p.id === productToRemove);
        document.getElementById("removeName").textContent = `${product.name} (${product.colour})`;
        modal.classList.add("show");
      }
    });

    // Cancel – product stays
    document.getElementById("cancelRemove").addEventListener("click", function () {
      productToRemove = null;
      modal.classList.remove("show");
    });

    // Confirm – product is removed from the list
    document.getElementById("confirmRemove").addEventListener("click", function () {
      items = items.filter(p => p.id !== productToRemove);
      productToRemove = null;
      modal.classList.remove("show");
      showProducts();
    });

    search.addEventListener("input", showProducts);
    showProducts();
  </script>
</body>
</html>
